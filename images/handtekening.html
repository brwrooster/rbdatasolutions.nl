<!-- Alles hieronder is de handtekening. Selecteer alles op deze pagina,
     kopieer het, en plak het in Instellingen > Apps > Mail > Handtekening.
     Opmaak met tabellen en inline stijlen, want mailprogramma's gooien
     losse stylesheets weg. -->

<table cellpadding="0" cellspacing="0" border="0" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:11px;line-height:1.4;color:#12233d;">
  <tr>
    <td style="padding:0 12px 0 0;vertical-align:middle;">
      <!-- Het bestand is 240 breed en wordt op 64 getoond: ruim scherp genoeg,
           en klein genoeg om niet te overheersen naast de tekst van de mail
           zelf. Hoogte staat er expliciet bij, want sommige mailprogramma's
           rekenen dat niet zelf uit. -->
      <img src="https://rbdatasolutions.nl/images/logo-mail.png"
           alt="RB Data Solutions"
           width="64" height="49"
           style="display:block;width:64px;height:49px;border:0;">
    </td>
    <td style="border-left:2px solid #a82127;padding:2px 0 2px 12px;vertical-align:middle;">

      <div style="font-size:12px;font-weight:700;color:#12233d;">Richard Bos</div>
      <div style="font-size:11px;color:#5a6b80;padding-bottom:5px;">RB Data Solutions</div>

      <div style="font-size:11px;color:#12233d;">
        <a href="tel:+31642305911" style="color:#12233d;text-decoration:none;">06 42 30 59 11</a><br>
        <a href="mailto:info@rbdatasolutions.nl" style="color:#12233d;text-decoration:none;">info@rbdatasolutions.nl</a><br>
        <a href="https://rbdatasolutions.nl" style="color:#a82127;text-decoration:none;font-weight:600;">rbdatasolutions.nl</a>
      </div>

      <!-- Zodra je KvK-nummer er is: de regel hieronder uit het commentaar
           halen en het nummer invullen. Tot die tijd staat hij er bewust niet,
           want een half ingevuld KvK-nummer oogt slordiger dan geen.
      <div style="font-size:10px;color:#8395ad;padding-top:6px;">
        KvK 12345678
      </div>
      -->

    </td>
  </tr>
