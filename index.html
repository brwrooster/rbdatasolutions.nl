<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RB Data Solutions - P2000 Monitor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }
        
        .fullscreen-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .fullscreen-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        /* Mobile responsiveness */
        @media (max-width: 768px) {
            .fullscreen-container img {
                object-fit: contain;
                background: #000;
            }
        }
    </style>
</head>
<body>
    <div class="fullscreen-container">
        <img src="./images/p2000-banner.jpg" alt="RB Data Solutions - P2000 Monitor">
    </div>
</body>
</html>
