<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RB Data Solutions - Kazernescherm</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 800px;
        }
        
        .logo {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            font-weight: bold;
            letter-spacing: -1px;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }
        
        .subtitle {
            font-size: 1.25rem;
            opacity: 0.9;
            margin-bottom: 2rem;
            font-weight: 300;
        }
        
        .status {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 2rem;
            margin: 2rem 0;
            backdrop-filter: blur(10px);
        }
        
        .status-item {
            margin: 1rem 0;
            font-size: 1rem;
        }
        
        .status-label {
            opacity: 0.8;
            font-weight: 500;
        }
        
        .status-value {
            font-weight: 700;
            font-size: 1.3rem;
            margin-top: 0.5rem;
        }
        
        .footer {
            margin-top: 3rem;
            font-size: 0.875rem;
            opacity: 0.7;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            padding-top: 1.5rem;
        }
        
        .loading {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: #4ade80;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🚒</div>
        <h1>RB Data Solutions</h1>
        <p class="subtitle">Kazernescherm - P2000 Emergency Dispatch System</p>
        
        <div class="status">
            <div class="status-item">
                <div class="status-label">Status</div>
                <div class="status-value">
                    <span class="loading"></span> Online
                </div>
            </div>
            <div class="status-item">
                <div class="status-label">Domain</div>
                <div class="status-value">rbdatasolutions.nl</div>
            </div>
            <div class="status-item">
                <div class="status-label">Hosting</div>
                <div class="status-value">Cloudflare Pages</div>
            </div>
        </div>
        
        <div class="footer">
            © 2026 RB Data Solutions. Alle rechten voorbehouden.<br>
            www.rbdatasolutions.nl / Info@rbdatasolutions.nl
        </div>
    </div>
</body>
</html>
