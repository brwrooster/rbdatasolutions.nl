<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Klanten — RB Data Solutions</title>
<style>
  :root{--ink:#0e1621;--muted:#5b6672;--rood:#c8102e;--groen:#1f7a4d}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--ink);color:#e8edf2;font-size:16px;line-height:1.45;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-text-size-adjust:100%;padding-bottom:40px;
  }
  .wrap{max-width:820px;margin:0 auto;padding:16px}
  .kop{padding:18px 4px 6px}
  .kop .merk{font-weight:700;font-size:18px}
  .kop .sub{color:#8d9aa8;font-size:13px;margin-top:2px}
  .streep{height:3px;background:var(--rood);border-radius:2px;margin:10px 4px 18px}
  .topnav{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 12px;margin:0 -4px 4px;-webkit-overflow-scrolling:touch}
  .topnav a{flex:0 0 auto;padding:8px 13px;border-radius:8px;background:#131c27;border:1px solid #253243;color:#9fadbb;font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap}
  .topnav a.actief{background:var(--rood);border-color:var(--rood);color:#fff}

  fieldset{border:1px solid #253243;border-radius:10px;margin:0 0 16px;padding:14px 14px 8px;background:#131c27}
  legend{font-weight:600;font-size:15px;padding:0 8px;color:#fff}
  label{display:block;font-size:13px;color:#9fadbb;margin:10px 0 4px}
  input,select,textarea{
    width:100%;padding:11px 12px;font-size:16px;font-family:inherit;
    border:1px solid #2b3a4c;border-radius:8px;background:#0c141d;color:#eaf0f6;
  }
  input:focus,select:focus{outline:2px solid var(--rood);outline-offset:1px;border-color:var(--rood)}
  .duo{display:flex;gap:10px}.duo>div{flex:1}
  button{font-family:inherit;cursor:pointer}
  .knop{display:block;width:100%;padding:12px;border-radius:10px;border:none;background:var(--rood);color:#fff;font-size:14.5px;font-weight:600;margin-top:8px;text-align:center;text-decoration:none}
  .knop.stil{background:#22303f;color:#dbe4ec}
  .hint{font-size:12.5px;color:#8d9aa8;margin:8px 2px 0;line-height:1.55}

  .kaart{border:1px solid #2b3a4c;border-radius:10px;padding:14px;margin:0 0 12px;background:#0f1822}
  .kaart .naam{font-weight:700;font-size:16px}
  .kaart .detail{font-size:13px;color:#9fadbb;margin-top:4px;line-height:1.6}
  .badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .badge{font-size:11.5px;padding:4px 9px;border-radius:20px;background:#1a2531;color:#9fadbb;text-decoration:none;border:1px solid #2b3a4c}
  .badge.akkoord{background:#12301f;color:#7fe0ac;border-color:#1f5c3a}
  .badge.afgewezen{background:#341418;color:#ff8d9c;border-color:#5c2530}
  .badge.opgeleverd{background:#12232f;color:#7fc4e0;border-color:#1f4a5c}
  .badge.gefactureerd{background:#33280f;color:#f0c674;border-color:#5c481f}
  .badge.betaald{background:#12301f;color:#7fe0ac;border-color:#1f5c3a}
  .kaart .acties{display:flex;gap:8px;margin-top:10px}
  .kaart .acties a, .kaart .acties button{flex:1;margin-top:0}
  .bewerk{display:none;margin-top:12px;border-top:1px solid #253243;padding-top:12px}
  .leeg{color:var(--muted);font-style:italic}
</style>
</head>
<body>
<div class="wrap">
  <div class="kop">
    <div class="merk">Klanten</div>
    <div class="sub">P2000 kazernescherm — RB Data Solutions</div>
  </div>
  <div class="streep"></div>
  <nav class="topnav">
    <a href="overzicht.html">Overzicht</a>
    <a href="klanten.html" class="actief">Klanten</a>
    <a href="offerte.html">Offertes</a>
    <a href="opleverbon.html">Opleverbonnen</a>
    <a href="facturen.html">Facturen</a>
    <a href="bestellingen.html">Onderdelen</a>
    <a href="prijzen.html">Prijzen</a>
  </nav>

  <fieldset>
    <legend>Zoeken</legend>
    <input id="zoek" placeholder="Typ een postnaam, organisatie of plaats">
    <button class="knop stil" id="nieuw">Nieuwe klant toevoegen</button>
  </fieldset>

  <div id="lijst"><p class="leeg">Klanten laden…</p></div>
</div>

<script>
const el = id => document.getElementById(id);
const API = "/tools/api";
async function apiGet(pad){
  try{ const r = await fetch(API+pad); if(!r.ok) return null; return await r.json(); }
  catch(e){ return null; }
}
async function apiPut(pad, data){
  try{
    const r = await fetch(API+pad, {method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(data)});
    return r.ok;
  }catch(e){ return false; }
}
function klantSlug(naam){
  return (naam||"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"") || "klant";
}
function statusVan(d){
  if(d.afgewezen) return "afgewezen";
  if(d.factuur && d.factuur.betaald) return "betaald";
  if(d.factuur) return "gefactureerd";
  if(d.opgeleverd) return "opgeleverd";
  if(d.akkoord) return "akkoord";
  return "concept";
}
const STATUS_LABEL = {concept:"Concept", akkoord:"Akkoord", afgewezen:"Afgewezen", opgeleverd:"Opgeleverd", gefactureerd:"Gefactureerd", betaald:"Betaald"};

let klanten = {}, offertes = {};

async function laden(){
  const [k, o] = await Promise.all([apiGet("/klanten"), apiGet("/offertes")]);
  klanten = k || {}; offertes = o || {};
  if(!k && !o){ el("lijst").innerHTML = `<p class="leeg">Geen verbinding met de gedeelde opslag. Probeer het zo nog eens.</p>`; return; }
  renderen();
}

function offertesVanKlant(id){
  return Object.entries(offertes).filter(([nr,d])=> klantSlug(d.klant) === id);
}

function renderen(){
  const filter = (el("zoek").value||"").trim().toLowerCase();
  // klanten die alleen via een offerte bekend zijn (nog nooit apart bewerkt) ook meenemen
  Object.values(offertes).forEach(d=>{
    const id = klantSlug(d.klant);
    if(d.klant && !klanten[id]) klanten[id] = { post: d.klant, org:"", contact:"", adres:"", mail:"" };
  });
  let ids = Object.keys(klanten).filter(id=>{
    if(!filter) return true;
    const d = klanten[id];
    return [d.post,d.org,d.contact,d.adres].some(v=>(v||"").toLowerCase().includes(filter));
  }).sort((a,b)=>(klanten[a].post||klanten[a].org||"").localeCompare(klanten[b].post||klanten[b].org||""));

  if(!ids.length){ el("lijst").innerHTML = `<p class="leeg">Geen klanten gevonden.</p>`; return; }

  el("lijst").innerHTML = ids.map(id=>{
    const d = klanten[id];
    const naam = d.post || d.org || id;
    const offs = offertesVanKlant(id).sort((a,b)=>(b[1].laatstGewijzigd||"").localeCompare(a[1].laatstGewijzigd||""));
    const badges = offs.map(([nr,od])=>{
      const st = statusVan(od);
      return `<a class="badge ${st}" href="offerte.html?nr=${encodeURIComponent(nr)}">${nr} · ${STATUS_LABEL[st]}</a>`;
    }).join("") || `<span class="hint" style="margin:0">Nog geen offerte voor deze klant</span>`;
    return `
      <div class="kaart" data-id="${id}">
        <div class="naam">${naam}</div>
        <div class="detail">
          ${d.org && d.post ? d.org+"<br>" : ""}
          ${d.contact ? d.contact+"<br>" : ""}
          ${d.adres ? d.adres.replace(/\n/g,"<br>")+"<br>" : ""}
          ${d.mail ? d.mail : ""}
        </div>
        <div class="badges">${badges}</div>
        <div class="acties">
          <a class="knop" href="offerte.html?klant=${encodeURIComponent(id)}">Nieuwe offerte</a>
          <button class="knop stil" data-bewerk="${id}">Bewerken</button>
        </div>
        <div class="bewerk" id="bewerk-${id}">
          <label>Post of kazerne</label><input data-veld="post" data-id="${id}" value="${d.post||""}">
          <label>Organisatie</label><input data-veld="org" data-id="${id}" value="${d.org||""}">
          <label>Contactpersoon</label><input data-veld="contact" data-id="${id}" value="${d.contact||""}">
          <label>Adres</label><textarea rows="2" data-veld="adres" data-id="${id}">${d.adres||""}</textarea>
          <label>E-mail</label><input data-veld="mail" data-id="${id}" value="${d.mail||""}">
        </div>
      </div>`;
  }).join("");
}

el("zoek").addEventListener("input", renderen);

document.addEventListener("click", e=>{
  if(e.target.dataset.bewerk){
    const box = el("bewerk-"+e.target.dataset.bewerk);
    box.style.display = box.style.display==="block" ? "none" : "block";
  }
});

let opslaanTimer = null;
document.addEventListener("input", e=>{
  if(!e.target.dataset.veld) return;
  const id = e.target.dataset.id, veld = e.target.dataset.veld;
  klanten[id] = klanten[id] || {};
  klanten[id][veld] = e.target.value;
  clearTimeout(opslaanTimer);
  opslaanTimer = setTimeout(async ()=>{
    await apiPut("/klanten/"+encodeURIComponent(id), klanten[id]);
    const kaart = document.querySelector(`.kaart[data-id="${id}"] .naam`);
    if(kaart) kaart.textContent = klanten[id].post || klanten[id].org || id;
  }, 500);
});

el("nieuw").addEventListener("click", ()=>{
  const naam = prompt("Naam van de post of organisatie:");
  if(!naam || !naam.trim()) return;
  const id = klantSlug(naam);
  klanten[id] = { post: naam.trim(), org:"", contact:"", adres:"", mail:"" };
  apiPut("/klanten/"+encodeURIComponent(id), klanten[id]);
  renderen();
  const box = el("bewerk-"+id);
  if(box) box.style.display = "block";
});

laden();
</script>
</body>
</html>
