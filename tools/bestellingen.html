<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Onderdelen — RB Data Solutions</title>
<style>
  :root{--ink:#0e1621;--muted:#5b6672;--rood:#c8102e;--groen:#1f7a4d}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--ink);color:#e8edf2;font-size:16px;line-height:1.45;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-text-size-adjust:100%;padding-bottom:40px;
  }
  .wrap{max-width:820px;margin:0 auto;padding:16px}
  .kop{padding:18px 4px 6px}
  .kop .merk{font-weight:700;font-size:18px}
  .kop .sub{color:#8d9aa8;font-size:13px;margin-top:2px}
  .streep{height:3px;background:var(--rood);border-radius:2px;margin:10px 4px 18px}
  .topnav{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 12px;margin:0 -4px 4px;-webkit-overflow-scrolling:touch}
  .topnav a{flex:0 0 auto;padding:8px 13px;border-radius:8px;background:#131c27;border:1px solid #253243;color:#9fadbb;font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap}
  .topnav a.actief{background:var(--rood);border-color:var(--rood);color:#fff}

  fieldset{border:1px solid #253243;border-radius:10px;margin:0 0 16px;padding:14px 14px 8px;background:#131c27}
  legend{font-weight:600;font-size:15px;padding:0 8px;color:#fff}
  label{display:block;font-size:13px;color:#9fadbb;margin:10px 0 4px}
  input{width:100%;padding:11px 12px;font-size:16px;font-family:inherit;border:1px solid #2b3a4c;border-radius:8px;background:#0c141d;color:#eaf0f6}
  input:focus{outline:2px solid var(--rood);outline-offset:1px;border-color:var(--rood)}
  button{font-family:inherit;cursor:pointer}
  .hint{font-size:12.5px;color:#8d9aa8;margin:8px 2px 0;line-height:1.55}
  .leeg{color:var(--muted);font-style:italic}

  table.som{width:100%;border-collapse:collapse;font-size:14.5px}
  table.som td{padding:7px 0;border-bottom:1px solid #1c2734}
  table.som td:last-child{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
  table.som tr:last-child td{border-bottom:none}

  .kaart{border:1px solid #2b3a4c;border-radius:10px;padding:14px;margin:0 0 12px;background:#0f1822}
  .kaart .naam{font-weight:700;font-size:15px}
  .kaart .sub{font-size:12px;color:#8d9aa8;margin-top:2px}
  .kaart ul{margin:10px 0 0;padding-left:18px;font-size:13.5px;line-height:1.7}
  .kaart .acties{display:flex;gap:8px;margin-top:12px}
  .knop{flex:1;padding:10px;border-radius:9px;border:none;background:var(--groen);color:#fff;font-size:13.5px;font-weight:600}
  .knop.stil{background:#22303f;color:#dbe4ec}
  .besteld-tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:20px;background:#12301f;color:#7fe0ac;margin-left:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="kop">
    <div class="merk">Onderdelen</div>
    <div class="sub">P2000 kazernescherm — RB Data Solutions</div>
  </div>
  <div class="streep"></div>
  <nav class="topnav">
    <a href="overzicht.html">Overzicht</a>
    <a href="klanten.html">Klanten</a>
    <a href="offerte.html">Offertes</a>
    <a href="opleverbon.html">Werkbon</a>
    <a href="facturen.html">Facturen</a>
    <a href="bestellingen.html" class="actief">Onderdelen</a>
    <a href="prijzen.html">Prijzen</a>
  </nav>

  <fieldset>
    <legend>Totaal nog te bestellen</legend>
    <div id="totaal"><p class="leeg">Laden…</p></div>
    <p class="hint">Opgeteld over alle offertes hieronder die akkoord hebben maar nog niet als besteld zijn gemarkeerd.</p>
  </fieldset>

  <fieldset>
    <legend>Per offerte</legend>
    <div id="open_lijst"><p class="leeg">Laden…</p></div>
  </fieldset>

  <fieldset id="vak_besteld" style="display:none">
    <legend>Al besteld</legend>
    <div id="besteld_lijst"></div>
  </fieldset>
</div>

<script>
const el = id => document.getElementById(id);
const API = "/tools/api";
async function apiGet(pad){
  try{ const r = await fetch(API+pad); if(!r.ok) return null; return await r.json(); }
  catch(e){ return null; }
}
async function apiPut(pad, data){
  try{
    const r = await fetch(API+pad, {method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(data)});
    return r.ok;
  }catch(e){ return false; }
}
const dNL = s => s ? new Date(s+"T00:00:00").toLocaleDateString("nl-NL",{day:"numeric",month:"long",year:"numeric"}) : "";
const iso = d => d.toISOString().slice(0,10);

function onderdelenNodig(r){
  const n = Number(r.aantal||0);
  const items = [];
  if(r.type==="master")   items.push({label:"Kazernecomputer met ontvanger", aantal:n});
  if(r.type==="slave_pi") items.push({label:"Kazernecomputer (extra scherm)", aantal:n});
  items.push({label:`IPS-scherm ${r.inch} inch`, aantal:n});
  if(r.beugel) items.push({label:"Muurbeugel", aantal:n});
  return items;
}
function onderdelenVanOfferte(d){
  const uit = [];
  (d.regels||[]).forEach(r=>{ onderdelenNodig(r).forEach(it=>uit.push(it)); });
  return uit;
}

let alleOffertes = {};

async function laden(){
  const o = await apiGet("/offertes");
  if(!o){ el("open_lijst").innerHTML = `<p class="leeg">Geen verbinding met de gedeelde opslag.</p>`; return; }
  alleOffertes = o;
  renderen();
}

function renderen(){
  const open = Object.entries(alleOffertes).filter(([nr,d])=> d.akkoord && !d.afgewezen && !d.besteld);
  const besteld = Object.entries(alleOffertes).filter(([nr,d])=> d.akkoord && !d.afgewezen && d.besteld);

  // totaal
  const som = {};
  open.forEach(([nr,d])=>{ onderdelenVanOfferte(d).forEach(it=>{ som[it.label] = (som[it.label]||0) + it.aantal; }); });
  const somRijen = Object.entries(som);
  el("totaal").innerHTML = somRijen.length
    ? `<table class="som">${somRijen.map(([l,a])=>`<tr><td>${l}</td><td>${a}×</td></tr>`).join("")}</table>`
    : `<p class="leeg">Niets openstaand — alles is al besteld of opgeleverd.</p>`;

  // per offerte, openstaand
  if(!open.length){
    el("open_lijst").innerHTML = `<p class="leeg">Geen offertes die nog besteld moeten worden.</p>`;
  } else {
    el("open_lijst").innerHTML = open.map(([nr,d])=>{
      const items = onderdelenVanOfferte(d);
      return `<div class="kaart">
        <div class="naam">${nr} — ${d.klant||"naam nog niet ingevuld"}</div>
        <div class="sub">${d.opgeleverd ? "Al opgeleverd" : "Nog niet opgeleverd"}</div>
        <ul>${items.map(it=>`<li>${it.aantal}× ${it.label}</li>`).join("")}</ul>
        <div class="acties">
          <button class="knop" data-besteld="${nr}">Markeer als besteld</button>
          <a class="knop stil" style="text-align:center;text-decoration:none;display:block" href="offerte.html?nr=${encodeURIComponent(nr)}">Offerte openen</a>
        </div>
      </div>`;
    }).join("");
  }

  // al besteld
  if(besteld.length){
    el("vak_besteld").style.display = "";
    el("besteld_lijst").innerHTML = besteld.map(([nr,d])=>`
      <div class="kaart">
        <div class="naam">${nr} — ${d.klant||"naam nog niet ingevuld"}<span class="besteld-tag">Besteld ${dNL(d.besteld.datum)}</span></div>
        <div class="acties">
          <button class="knop stil" data-heropen="${nr}">Terugzetten naar nog te bestellen</button>
        </div>
      </div>`).join("");
  } else {
    el("vak_besteld").style.display = "none";
  }
}

document.addEventListener("click", async e=>{
  if(e.target.dataset.besteld){
    const nr = e.target.dataset.besteld;
    await apiPut("/offertes/"+encodeURIComponent(nr), { besteld: { datum: iso(new Date()) } });
    alleOffertes[nr].besteld = { datum: iso(new Date()) };
    renderen();
  }
  if(e.target.dataset.heropen){
    const nr = e.target.dataset.heropen;
    await apiPut("/offertes/"+encodeURIComponent(nr), { besteld: null });
    alleOffertes[nr].besteld = null;
    renderen();
  }
});

laden();
</script>
</body>
</html>
